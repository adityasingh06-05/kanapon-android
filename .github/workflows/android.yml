name: Android

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_PACKAGES: platforms;android-37.0 build-tools;36.0.0

jobs:
  check:
    name: Lint, unit tests, screenshots, build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" $SDK_PACKAGES > /dev/null
      # verifyRoborazziDebug runs every unit test (engine parity, lifecycle, export) and compares the
      # screenshots against app/src/test/screenshots.
      - name: Check
        run: ./gradlew ktlintCheck verifyRoborazziDebug lintDebug assembleDebug --stacktrace
      - name: Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kanapon-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports
            app/build/outputs/roborazzi

  device:
    name: On an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" $SDK_PACKAGES > /dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace
      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-reports
          path: app/build/reports/androidTests
